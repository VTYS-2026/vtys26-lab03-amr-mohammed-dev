version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: vtys-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vtys
      POSTGRES_PASSWORD: vtys123
      POSTGRES_DB: vtysdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
